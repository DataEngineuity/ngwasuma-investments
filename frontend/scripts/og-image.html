<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
  />
  <style>
    body {
      margin: 0;
      background: #444;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Onest', system-ui, sans-serif;
    }

    /* The OG card itself — exact 1200×630 export size */
    .og {
      width: 1200px;
      height: 630px;
      background: #0E2B26;
      position: relative;
      overflow: hidden;
      color: #fff;
    }

    /* Decorative lime grid in the background */
    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(168, 220, 47, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(168, 220, 47, 0.07) 1px, transparent 1px);
      background-size: 56px 56px;
    }

    /* Subtle lime gradient glow from bottom-right */
    .glow {
      position: absolute;
      right: -240px;
      bottom: -240px;
      width: 720px;
      height: 720px;
      background: radial-gradient(circle, rgba(168, 220, 47, 0.18) 0%, transparent 65%);
      pointer-events: none;
    }

    /* Top metadata strip */
    .meta {
      position: absolute;
      top: 56px;
      left: 64px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.55);
    }
    .meta-dot { color: #A8DC2F; font-size: 11px; }

    /* Bottom right: logo lockup */
    .logo {
      position: absolute;
      bottom: 56px;
      right: 64px;
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .logo svg { width: 56px; height: 56px; }
    .logo-wordmark {
      font-family: 'Onest', sans-serif;
      font-weight: 500;
      font-size: 36px;
      letter-spacing: -0.02em;
      color: #fff;
      line-height: 1;
      text-transform: lowercase;
    }
    .logo-sub {
      font-family: 'Onest', sans-serif;
      font-weight: 400;
      font-size: 11px;
      letter-spacing: 0.35em;
      color: rgba(255, 255, 255, 0.65);
      text-transform: uppercase;
      margin-top: 6px;
      text-align: right;
    }

    /* Main content area */
    .content {
      position: absolute;
      left: 64px;
      right: 64px;
      top: 50%;
      transform: translateY(-50%);
    }

    .headline {
      font-family: 'Onest', sans-serif;
      font-weight: 300;
      font-size: 96px;
      line-height: 0.92;
      letter-spacing: -0.04em;
      color: #fff;
      max-width: 14ch;
      margin: 0;
    }
    .headline-accent {
      color: #A8DC2F;
      font-weight: 400;
    }
    .headline-period {
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      color: #A8DC2F;
      font-weight: 400;
    }

    .tagline {
      margin-top: 28px;
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      font-size: 28px;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 0.005em;
    }

    /* Bottom-left service badges */
    .services {
      position: absolute;
      bottom: 56px;
      left: 64px;
      display: flex;
      gap: 16px;
    }
    .service-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(168, 220, 47, 0.12);
      color: #A8DC2F;
      border: 1px solid rgba(168, 220, 47, 0.3);
    }
  </style>
</head>
<body>
  <div class="og">
    <div class="grid"></div>
    <div class="glow"></div>

    <!-- Top meta strip -->
    <div class="meta">
      <span class="meta-dot">●</span>
      <span>Ngwasuma Investments Limited</span>
      <span style="opacity: 0.4;">/</span>
      <span>Lusaka · SADC</span>
    </div>

    <!-- Main headline -->
    <div class="content">
      <h1 class="headline">
        Delivering<br />
        the World to<br />
        <span class="headline-accent">You</span><span class="headline-period">.</span>
      </h1>
      <p class="tagline">Precision meets reliability.</p>
    </div>

    <!-- Service pills -->
    <div class="services">
      <span class="service-pill">Logistics</span>
      <span class="service-pill">Real Estate</span>
      <span class="service-pill">Car Hire</span>
    </div>

    <!-- Logo lockup, bottom right -->
    <div class="logo">
      <!-- The actual ngwasuma mark — two parallelograms, full color variant -->
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <!-- Left parallelogram (white) -->
        <path
          d="M 6 88 L 6 26 Q 6 12 20 12 L 44 12 L 44 74 Q 44 88 30 88 Z"
          fill="#ffffff"
          transform="skewX(-12)"
        />
        <!-- Right parallelogram (lime green) -->
        <path
          d="M 56 88 L 56 26 Q 56 12 70 12 L 94 12 L 94 74 Q 94 88 80 88 Z"
          fill="#A8DC2F"
          transform="skewX(-12) translate(4 0)"
        />
        <!-- Registered ® mark -->
        <circle cx="93" cy="14" r="3.5" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="0.8" />
        <text x="93" y="16.2" text-anchor="middle" font-family="Arial" font-size="4.5" fill="rgba(255,255,255,0.7)">R</text>
      </svg>

      <div>
        <div class="logo-wordmark">ngwasuma</div>
        <div class="logo-sub">Investments</div>
      </div>
    </div>
  </div>
</body>
</html>
